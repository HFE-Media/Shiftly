<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0C0C0C"/>
  <title>Shiftly Workforce Management</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/shiftly-favicon-32.png?v=148"/>
  <script>
    (function forwardExistingAuthCallback() {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const callbackTypes = [query.get("type"), hash.get("type")]
        .map((value) => String(value || "").toLowerCase());
      const hasAuthCallbackType = callbackTypes
        .some((type) => type === "invite" || type === "recovery");
      const hasSupabaseAuthError = [query, hash].some((params) => {
        const error = String(params.get("error") || "").toLowerCase();
        const errorCode = String(params.get("error_code") || "").toLowerCase();
        const errorDescription = String(params.get("error_description") || "");
        const knownAuthError = ["access_denied", "server_error", "temporarily_unavailable"].includes(error);
        const authShapedCode = /(^|_)(otp|token|invite|recovery|auth|email|session|code)(_|$)/.test(errorCode);
        return Boolean(error && errorCode && errorDescription && (knownAuthError || authShapedCode));
      });
      if (hasAuthCallbackType || hasSupabaseAuthError) {
        window.location.replace(`/login${window.location.search}${window.location.hash}`);
      }
    })();
  </script>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0c0c0c;color:#f3f2ee}
    main{width:min(560px,100%);padding:40px 28px;text-align:center;border:1px solid rgba(212,175,55,.28);border-radius:16px;background:#111;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;color:#d4af37;font-size:18px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .brandMark{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(212,175,55,.5);border-radius:10px}
    h1{margin:0;font-size:clamp(30px,7vw,48px);line-height:1.05}
    p{margin:16px auto 26px;max-width:430px;color:#aaa;font-size:16px;line-height:1.6}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:10px;background:linear-gradient(180deg,#e7c95f,#b8860b);color:#140f06;font-weight:900;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brandMark">S</span><span>Shiftly</span></div>
    <h1>Shiftly Workforce Management</h1>
    <p>A temporary public entry page while the Shiftly marketing website is prepared.</p>
    <a id="clientLoginLink" href="/login">Client Login</a>
  </main>
  <script>
    if (window.location.protocol === "file:") {
      document.getElementById("clientLoginLink").setAttribute("href", "./login.html");
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
